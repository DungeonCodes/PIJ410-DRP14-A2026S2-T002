<text x="280.0" y="396.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Filtros e cálculo determinístico</text>
<text x="280.0" y="425.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Somas, razões, séries e rankings</text>
<text x="280.0" y="454.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Sem dependência do experimento CPR</text>
