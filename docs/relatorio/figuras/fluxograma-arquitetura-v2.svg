<rect x="600" y="320" width="440" height="110" rx="10" fill="#f4f7fa" stroke="#8493a3" stroke-width="1.5"/>
<text x="820.0" y="353.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Execução separada pela CLI</text>
<text x="820.0" y="382.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Regressão e baselines temporais</text>
<text x="820.0" y="411.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Treinamento e avaliação fora da interface</text>
<path d="M820,430 L820,470" fill="none" stroke="#44566a" stroke-width="2"/><polygon points="820,470 815.0,460.0 825.0,460.0" fill="#44566a"/>
