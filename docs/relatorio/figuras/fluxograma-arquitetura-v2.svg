<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura analítica do protótipo acadêmico</title><desc id="desc">Fluxo determinístico independente do experimento de CPR pela CLI. Dados exclusivamente sintéticos e locais. Interfaces V1 a V4 com gates por versão.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#44566a"/></marker></defs>
<rect width="1100" height="1040" fill="white"/>
<text x="550" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#24364b">Arquitetura analítica do protótipo acadêmico</text>
<rect x="25" y="70" width="510" height="820" rx="10" fill="#fafcfe" stroke="#afbdca" stroke-width="1.5"/>
<rect x="565" y="70" width="510" height="820" rx="10" fill="#fcfcfa" stroke="#b9bdad" stroke-width="1.5"/>
<text x="280" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#24364b">FLUXO ANALÍTICO DETERMINÍSTICO</text>
<text x="820" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#24364b">EXPERIMENTO DE APRENDIZAGEM</text>
