<text x="820.0" y="233.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">Cronologia fictícia independente</text>
<text x="820.0" y="263.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">Entrada local do experimento</text>
