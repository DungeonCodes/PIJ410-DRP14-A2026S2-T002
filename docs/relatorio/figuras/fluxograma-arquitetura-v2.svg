<text x="280.0" y="323.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">Contratos e sinalização de ausências</text>
<path d="M280,340 L280,370" fill="none" stroke="#44566a" stroke-width="2"/><polygon points="280,370 275.0,360.0 285.0,360.0" fill="#44566a"/>
