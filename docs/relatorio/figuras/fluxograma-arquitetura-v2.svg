<text x="820.0" y="503.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Artefatos JSON reproduzíveis</text>
<text x="820.0" y="532.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Experimento inicial e extensão sazonal</text>
<text x="820.0" y="561.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#24364b">Métricas e projeções experimentais</text>
<path d="M820,580 L820,620" fill="none" stroke="#44566a" stroke-width="2"/><polygon points="820,620 815.0,610.0 825.0,610.0" fill="#44566a"/>
<rect x="600" y="620" width="440" height="145" rx="10" fill="#f4f7fa" stroke="#8493a3" stroke-width="1.5"/>
<text x="820.0" y="655.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">Apresentação em Google Ads</text>
<text x="820.0" y="685.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">Nas interfaces V2, V3 e V4</text>
<text x="820.0" y="715.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">Sem treinamento no navegador</text>
<text x="820.0" y="745.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">Desempenho preditivo limitado</text>
<text x="820" y="825" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">ML não integra o cálculo dos</text>
<text x="820" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#24364b">indicadores comuns da interface.</text>
<rect x="25" y="915" width="1050" height="95" rx="10" fill="#f5f5f5" stroke="#91999f" stroke-width="1.5"/>
<text x="550" y="946" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#24364b">AMBIENTE ACADÊMICO SEM CONEXÃO OPERACIONAL</text>
<text x="550" y="978" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#24364b">Sem dados reais, APIs de anúncios, CRM ou banco operacional; sem decisão autônoma de investimento.</text>
