            - paragraph [ref=f5e164]: O teste usa somente o cenário sintético. Os resultados não demonstram eficácia no ambiente real nem validação pela comunidade.
            - paragraph [ref=f5e165]: A regressão apresentou erros menores que a persistência, mas o ganho foi modesto e o poder explicativo permaneceu baixo. O resultado não determina orçamento, não prevê matrículas e não garante redução de CPR.
