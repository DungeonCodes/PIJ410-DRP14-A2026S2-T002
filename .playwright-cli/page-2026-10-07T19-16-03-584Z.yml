          - paragraph [ref=f8e349]: No cenário projetado, os maiores CPRs são estimados para 12/2023 e 02/2023; os menores para 05/2023 e 07/2023. São estimativas derivadas do artefato, não causalidade ou crescimento obrigatório. A recursão pode amplificar valores extremos do histórico.
          - group [ref=f8e350]:
            - generic "Valores projetados e diagnóstico sazonal" [ref=f8e351] [cursor=pointer]
          - paragraph [ref=f8e352]: "Sazonalidade descritiva não é ML: índice = média histórica do mês / média global dos CPRs mensais válidos. Valores extremos podem afetar a média; comparar também mediana e dispersão. Índice 1 significa média; acima/abaixo de 1 indica comportamento histórico relativo, não causa."
          - paragraph [ref=f8e353]: "Features: seno/cosseno do mês, índice temporal e CPR t−2/t−12. t−1 excluído pela maturação sintética de 14 dias; t−24 excluído para preservar amostras. Padronização somente no treino. Modelo final reajustado em 57 meses elegíveis. Previsão recursiva: janeiro/2023 provisório é estimado apenas como lag auxiliar, não como histórico observado. Não há intervalo de confiança calculado, treinamento no navegador ou recomendação automática de orçamento, matrículas, ROI ou receita."
