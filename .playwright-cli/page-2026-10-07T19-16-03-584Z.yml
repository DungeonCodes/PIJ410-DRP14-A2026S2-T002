            - heading "Experimento acadêmico de CPR" [level=2] [ref=f8e141]
            - paragraph [ref=f8e142]: Resultados fixos do experimento completo, independentes dos filtros. Features do mês t−2 já disponíveis na emissão de t; split temporal e treino sem dados de teste. Sem recomendação automática de orçamento.
            - paragraph [ref=f8e143]: "Treino: 198 amostras · teste: 71 · corte: 2021-07-01."
            - paragraph [ref=f8e144]: "Features: CPR, CTR, CPC e log(1 + cliques) históricos de t−2; seno e cosseno do mês de t. Maturação de 14 dias apenas como hipótese sintética; padronização ajustada somente no treino. Artefato reproduzível pela CLI, sem treinamento no navegador."
